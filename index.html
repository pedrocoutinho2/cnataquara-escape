<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#fff;color:var(--ink);

.cron.alerta-tempo{color:var(--red);animation:pulsa .9s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.45}}
#confete{position:fixed;inset:0;pointer-events:none;z-index:60}
.carimbo{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.carimbo span{font-weight:700;font-size:clamp(22px,6.5vw,34px);letter-spacing:.02em;text-transform:uppercase;
  color:#fff;background:var(--ok);padding:12px 22px;border-radius:12px;transform:rotate(-7deg) scale(.4);
  opacity:0;box-shadow:0 10px 28px rgba(31,157,85,.4);animation:bate .5s cubic-bezier(.2,1.5,.4,1) forwards}
.carimbo.falhou span{background:var(--red);box-shadow:0 10px 28px rgba(230,20,60,.4)}
@keyframes bate{0%{transform:rotate(-7deg) scale(.4);opacity:0}
  60%{transform:rotate(-7deg) scale(1.12);opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.dani-comemora{position:fixed;right:8px;bottom:-260px;width:min(150px,36vw);z-index:61;pointer-events:none;

</style>

const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

async function rpc(fn,args){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(args||{})});
  const t=await r.text();
  if(!r.ok){ let m=t; try{m=JSON.parse(t).message||t}catch(e){} throw new Error(m); }

async function sel(path){

  return r.json();

/* ============ UNIDADE ============
   Vem de ?unidade=<slug>, validada em crm_unidades (status diferente de inativa).
   Sem parametro ou com slug invalido: taquara, para os links e QR codes que ja
   existem continuarem funcionando. Nome exibido vem do banco. */
const UNIDADE_PADRAO='taquara';
const UNID={slug:UNIDADE_PADRAO,nome:'',temporadas:[],ig:''};
async function resolveUnidade(){
  const pedida=(new URLSearchParams(location.search).get('unidade')||'').trim().toLowerCase();
  let r=[];
  if(pedida) r=await sel('crm_unidades?slug=eq.'+encodeURIComponent(pedida)+'&status=neq.inativa&select=slug,nome');
  if(!r.length) r=await sel('crm_unidades?slug=eq.'+UNIDADE_PADRAO+'&select=slug,nome');
  if(r.length){UNID.slug=r[0].slug;UNID.nome=r[0].nome;}
  if(UNID.nome) document.title='CNA '+UNID.nome+' · O Sumiço da Dani';
  const t=await sel('escape_temporadas?unidade=eq.'+encodeURIComponent(UNID.slug)+'&select=id');
  UNID.temporadas=t.map(x=>x.id);
  try{
    const c=await sel('crm_configs?unidade=eq.'+encodeURIComponent(UNID.slug)+'&chave=eq.instagram&select=valor');
    /* aceita "@perfil", "perfil" ou a URL do perfil */
    UNID.ig=String((c[0]&&c[0].valor)||'').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/\/.*$/,'');
  }catch(e){ UNID.ig=''; }
}

const app=document.getElementById('app');
const S={jogador:null,sessao:null,temporada:null,salas:[],feitas:{},sala:null,t0:0,tick:null,erros:0,dicas:0,fim:null,limite:0,travada:false};
const QR=new URLSearchParams(location.search).get('qr');
const ms2=m=>{ if(m==null) return '--:--'; const s=Math.floor(m/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
const marca=(compacta)=>`<div class="marca${compacta?' compacta':''}">
  <img src="assets/logo-cna.png" alt="CNA Idiomas" width="118" height="52">
  <span class="unidade">${UNID.nome?'Unidade '+esc(UNID.nome):''}</span></div>`;
/* Instagram vem de crm_configs.instagram da unidade; sem valor, o link some */
const rodape=()=>`<div class="rodape">${UNID.ig?`Siga a gente em <a href="https://instagram.com/${encodeURIComponent(UNID.ig)}" target="_blank" rel="noopener">@${esc(UNID.ig)}</a>`:''}
  <span class="mote">Você monstrão no Inglês</span></div>`;

/* ============ VALIDACAO DE TEXTO ============ */
const LEET={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i','|':'i'};
function normaliza(t){
  return String(t||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[013457@$!|]/g,c=>LEET[c]||c)
    .replace(/[^a-z\s]/g,' ')
    .replace(/(.)\1{2,}/g,'$1$1')
    .replace(/\s+/g,' ').trim();
}
const PALAVRAS=['cu','cus','cuzao','cuzinho','puta','puto','putas','putos','putaria','putinha','buceta','boceta',
'xoxota','xereca','pepeca','piroca','pica','pika','caralho','caraio','porra','poha','merda','bosta','fdp','pqp',
'foda','fode','foder','fuder','fodase','punheta','siririca','boquete','gozar','gozada','tesao','tarado','tarada',
'safada','safado','safadeza','vadia','vagabunda','vagabundo','arrombado','arrombada','corno','cornao',
'viado','veado','traveco','escroto','otario','otaria','babaca','desgracado','desgracada','pinto','penis',
'bunda','bundao','nude','nudes','sexo','sexy','transar','transa','pelado','pelada','gostosa','gostoso',
'cachorra','piranha','biscate','rapariga','novinha','novinho','macumbeiro','viadinho',
'fuck','fucking','fucker','shit','bitch','pussy','dick','cock','cunt','whore','slut','asshole',
'nigga','nigger','porn','porno','hentai','nazi','nazista','hitler'];
const COMPOSTAS=['filhadaputa','filhodaputa','vaitomarnocu','vaisefoder','vtnc','caralho','buceta','piroca',
'punheta','boquete','xoxota','arrombado','desgracado','chupame','tomanocu','meupau','fuckyou','motherfucker',
'fdp','pqp','vsf','krl','vtmnc','pnc'];
function impropria(t){
  const n=normaliza(t); if(!n) return false;
  for(const tk of n.split(' ')){
    if(PALAVRAS.includes(tk)) return true;
    for(const p of PALAVRAS){ if(p.length>=5 && tk.startsWith(p)) return true; }
  }
  const junto=n.replace(/ /g,'');
  for(const c of COMPOSTAS){ if(junto.includes(c)) return true; }
  return false;
}
function validaNome(v){
  const t=String(v||'').trim().replace(/\s+/g,' ');
  if(!t) return 'Preencha seu nome.';
  if(!/^[A-Za-zÀ-ÿ' ]+$/.test(t)) return 'Use só letras no nome.';
  if(t.split(' ').filter(w=>w.length>1).length<2) return 'Escreva nome e sobrenome.';
  if(t.length<5) return 'Escreva seu nome completo.';
  if(impropria(t)) return 'Esse nome não pode ser usado. Escreva seu nome de verdade.';
  return null;
}
function validaApelido(v){
  const t=String(v||'').trim();
  if(!t) return 'Escolha um apelido para o ranking.';
  if(t.length<2) return 'O apelido precisa de pelo menos 2 letras.';
  if(t.length>18) return 'Máximo de 18 caracteres.';
  if(!/^[A-Za-zÀ-ÿ0-9' ._-]+$/.test(t)) return 'Use letras, números, ponto, hífen ou underline.';
  if(!/[A-Za-zÀ-ÿ]/.test(t)) return 'O apelido precisa ter pelo menos uma letra.';
  if(impropria(t)) return 'Esse apelido não pode aparecer no ranking. Escolha outro.';
  return null;
}
function validaTel(v){
  const d=digits(v);
  if(!d) return 'Preencha seu WhatsApp.';
  if(d.length<10) return 'Faltam números no WhatsApp.';
  if(d.length>11) return 'Esse número tem dígitos demais.';
  if(parseInt(d.slice(0,2),10)<11) return 'DDD inválido.';
  if(d.length===11 && d[2]!=='9') return 'Celular de 9 dígitos começa com 9 depois do DDD.';
  if(/^(\d)\1+$/.test(d.slice(2))) return 'Esse número não parece real.';
  return null;
}
function mascaraTel(v){
  const d=digits(v).slice(0,11);
  if(!d.length) return '';
  if(d.length<=2) return '('+d;
  if(d.length<=6) return '('+d.slice(0,2)+') '+d.slice(2);
  if(d.length<=10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}

/* ============ ANIMACOES ============ */
const semMovimento=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function confete(){
  if(semMovimento()) return;
  const c=document.createElement('canvas'); c.id='confete'; document.body.appendChild(c);
  const ctx=c.getContext('2d'), dpr=Math.min(devicePixelRatio||1,2);
  const L=()=>{ c.width=innerWidth*dpr; c.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  L();
  const cores=['#E6143C','#19408B','#FFC800','#A30E2A'];
  const P=[]; const N=Math.min(120,Math.round(innerWidth/4));
  for(let i=0;i<N;i++) P.push({
    x:innerWidth/2+(Math.random()-.5)*innerWidth*.5, y:innerHeight*.42,
    vx:(Math.random()-.5)*9, vy:-6-Math.random()*9,
    w:5+Math.random()*6, h:8+Math.random()*8, cor:cores[i%cores.length],
    rot:Math.random()*6.28, vr:(Math.random()-.5)*.34, vida:1
  });
  const t0=performance.now();
  (function anima(t){
    const dt=Math.min((t-t0)/1000,4);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    let vivos=0;
    for(const p of P){
      p.vy+=.32; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=.99;
      if(dt>1.6) p.vida-=.016;
      if(p.vida>0 && p.y<innerHeight+40){
        vivos++;
        ctx.save(); ctx.globalAlpha=Math.max(p.vida,0);
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.cor; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      }
    }
    if(vivos) requestAnimationFrame(anima); else c.remove();
  })(t0);
}

    <div id="camada"></div>
  </div>
  <div id="extra"></div>
  <div class="acoes">
    <button class="btn ghost small" id="dica">Pedir uma dica (+15s)</button>
    <button class="btn small hidden" id="prox" style="margin-left:auto">Próxima sala</button>
  </div>`;
  S.t0=Date.now(); S.limite=sala.teto_ms||240000; S.travada=false;
  clearInterval(S.tick);
  S.tick=setInterval(()=>{
    const c=document.getElementById('cron'); if(!c) return;
    const resta=S.limite-(Date.now()-S.t0);
    c.textContent=ms2(Math.max(resta,0));

    frase_audio:mFrase,luz_negra:mLuzNegra};

async function estourouTempo(p){
  if(S.travada) return; S.travada=true;
  document.querySelectorAll('#cena button, #extra button, #extra input').forEach(b=>b.disabled=true);
  const dica=document.getElementById('dica'); if(dica) dica.disabled=true;
  const cron=document.getElementById('cron');
  if(cron){ cron.textContent='00:00'; cron.classList.remove('alerta-tempo'); cron.style.color='var(--red)'; }
  carimbo('Tempo esgotado',true); vibra(220);
  let r={pontuacao:0,tempo_ms:S.limite,estourou:true};
  try{ r=await rpc('escape_sala_estourar',{p_sessao_id:S.sessao,p_sala_slug:S.sala.slug,
        p_erros:S.erros,p_dicas:S.dicas}); }catch(e){}
  S.feitas[S.sala.slug]=r;
  const i=document.getElementById('instr');
  i.classList.remove('ok');
  i.style.background='var(--pastelRed)'; i.style.borderLeftColor='var(--red)';
  i.innerHTML='<b>O tempo acabou nesta sala.</b> Zero ponto aqui, mas a busca continua.';
  const resp=respostaDe(p);
  if(resp){ const d=document.createElement('div'); d.className='resposta';
    d.innerHTML=`A resposta era: <b>${esc(resp)}</b>`;
    document.getElementById('extra').appendChild(d); }
  const b=document.getElementById('prox'); b.classList.remove('hidden');
  const acabou=Object.keys(S.feitas).length>=S.salas.length;
  b.textContent=acabou?'Ver meu resultado':'Próxima sala';
  b.onclick=()=>acabou?fecharSessao():telaMapa();
}
function respostaDe(p){
  if(!p) return '';
  if(p.frase) return p.frase;
  if(p.senha) return p.senha;
  if(p.hotspots) return p.hotspots.slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0)).map(h=>h.label).join(' · ');
  if(p.palavras) return p.palavras.join(' · ');
  if(p.diffs) return p.diffs.map(d=>d.label).filter(Boolean).join(' · ');
  return '';
}
function erro(){ if(S.travada) return; S.erros++; const i=document.getElementById('instr');
  if(i){ i.style.borderLeftColor='var(--red)'; setTimeout(()=>{i.style.borderLeftColor='';},400); } }

async function concluiSala(){
  if(S.travada) return;
  S.travada=true; clearInterval(S.tick);
  const dica=document.getElementById('dica'); if(dica) dica.disabled=true;
  try{
    const r=await rpc('escape_sala_concluir',{p_sessao_id:S.sessao,p_sala_slug:S.sala.slug,
      p_erros:S.erros,p_dicas:S.dicas});
    S.feitas[S.sala.slug]=r;
    const i=document.getElementById('instr'); i.classList.add('ok');
    i.innerHTML=`<b>Pista encontrada.</b> ${ms2(r.tempo_ms)} · ${r.pontuacao} pontos`
      +(r.penalidade_ms?` · ${Math.round(r.penalidade_ms/1000)}s de penalidade`:'');
    carimbo('Pista encontrada'); confete(); daniComemora(); vibra([30,60,30]);
    const p=document.getElementById('prox'); p.classList.remove('hidden');
    const acabou=Object.keys(S.feitas).length>=S.salas.length;
    p.textContent=acabou?'Ver meu resultado':'Próxima sala';
    p.onclick=()=>acabou?fecharSessao():telaMapa();
  }catch(e){ document.getElementById('instr').innerHTML=esc(e.message); }
}

function mObjetos(p,done){
  const c=document.getElementById('camada'); let i=0;
  const alvos=(p.hotspots||[]).slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  document.getElementById('extra').innerHTML=
    `<div class="palavras" id="ordem">${alvos.map(a=>`<span class="pal" data-l="${esc(a.label)}">${esc(a.label)}</span>`).join('')}</div>`;
  alvos.forEach(a=>{
    const el=document.createElement('button'); el.className='hot';
    el.style.cssText=`left:${a.x}%;top:${a.y}%;width:${(a.r||8)*2}%;aspect-ratio:1`;
    el.setAttribute('aria-label',a.label);
    el.onclick=()=>{
      if(a===alvos[i]){ el.dataset.found='true'; el.disabled=true;
        document.querySelector(`#ordem .pal[data-l="${CSS.escape(a.label)}"]`).dataset.usada='true';
        if(++i>=alvos.length) done();
      } else erro();
    };
    c.appendChild(el);
  });

function mArrastar(p,done){
  const c=document.getElementById('camada'); const alvos=p.alvos||[]; let sel=null,ok=0;
  document.getElementById('extra').innerHTML=
    `<div class="palavras" id="pool">${(p.palavras||[]).map(w=>`<button class="pal" data-w="${esc(w)}" aria-pressed="false">${esc(w)}</button>`).join('')}</div>`;
  document.querySelectorAll('#pool .pal').forEach(b=>b.onclick=()=>{ sel=b.dataset.w;
    document.querySelectorAll('#pool .pal').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  alvos.forEach(a=>{
    const el=document.createElement('button'); el.className='alvo';
    el.style.cssText=`left:${a.x}%;top:${a.y}%`; el.textContent='?';
    el.onclick=()=>{
      if(!sel) return;
      if(sel===a.label){ el.dataset.done='true'; el.textContent=a.label; el.disabled=true;
        document.querySelector(`#pool .pal[data-w="${CSS.escape(sel)}"]`).dataset.usada='true';
        sel=null; if(++ok>=alvos.length) done();
      } else erro();
    };
    c.appendChild(el);
  });
}
function mDiferencas(p,done){
  const cena=document.getElementById('cena'), c=document.getElementById('camada');
  const seg=p.memorizar_s||10; let n=seg, ok=0;
  const ov=document.createElement('div'); ov.className='contagem'; ov.textContent=n; cena.appendChild(ov);
  document.getElementById('instr').textContent='Memorize a sala. '+seg+' segundos.';
  const t=setInterval(()=>{
    ov.textContent=--n;
    if(n<=0){
      clearInterval(t); ov.remove();
      document.getElementById('instr').textContent=p.instrucao||`Alguém mexeu em ${(p.diffs||[]).length} coisas. Ache todas.`;
      const fundo=document.createElement('button');

      fundo.setAttribute('aria-label','nada mudou aqui'); fundo.onclick=erro; c.appendChild(fundo);

        el.setAttribute('aria-label',d.label||'diferença');
        el.onclick=()=>{ el.dataset.found='true'; el.disabled=true; if(++ok>=(p.diffs||[]).length) done(); };
        c.appendChild(el);
      });

  },1000);

function mFrase(p,done){
  const alvo=(p.frase||'').trim().split(/\s+/);
  const emb=alvo.slice().sort(()=>Math.random()-.5);
  document.getElementById('extra').innerHTML=`
    ${p.audio_url?`<audio controls preload="none" src="${esc(p.audio_url)}"></audio>`
      :'<div class="instr" style="margin-top:16px">O áudio do professor entra aqui.</div>'}
    <div class="linha-frase" id="linha"></div>
    <div class="palavras" id="pool">${emb.map((w,i)=>`<button class="pal" data-i="${i}">${esc(w)}</button>`).join('')}</div>
    <button class="btn azul small" id="conferir" style="margin-top:16px">Conferir a frase</button>`;

    b.dataset.usada='true';

    const dito=[...linha.children].map(x=>x.textContent);
    if(dito.length===alvo.length && dito.every((w,i)=>w.toLowerCase()===alvo[i].toLowerCase())) done();
    else { erro(); document.getElementById('instr').textContent='Ainda não. Ouça de novo e confira a ordem.'; }

function mLuzNegra(p,done){
  const cena=document.getElementById('cena');
  const camada=document.createElement('div');
  camada.style.cssText='position:absolute;inset:0;background:rgba(10,14,32,.94);'+
    '-webkit-mask-image:radial-gradient(circle 0px at 50% 50%,#000 60%,transparent 100%);'+
    'mask-image:radial-gradient(circle 0px at 50% 50%,#000 60%,transparent 100%)';
  (p.letras||[]).forEach(l=>{ const s=document.createElement('span'); s.className='letra';
    s.style.cssText=`left:${l.x}%;top:${l.y}%`; s.textContent=l.char; camada.appendChild(s); });
  cena.appendChild(camada);
  const mover=e=>{
    const r=cena.getBoundingClientRect(); const pt=e.touches?e.touches[0]:e;
    const x=(pt.clientX-r.left)/r.width*100, y=(pt.clientY-r.top)/r.height*100;
    const m=`radial-gradient(circle 90px at ${x}% ${y}%,#000 55%,transparent 100%)`;
    camada.style.webkitMaskImage=m; camada.style.maskImage=m;
  };
  cena.addEventListener('pointermove',mover);
  cena.addEventListener('touchmove',e=>{e.preventDefault();mover(e);},{passive:false});
  document.getElementById('extra').innerHTML=`
    <div class="field" style="margin-top:16px">
      <label for="senha">A palavra escondida</label>

  };

  <div class="placar">${r.pontuacao} pontos</div>
  <div class="stats">
    <div class="stat"><b>${ms2(r.tempo_total_ms)}</b><span>tempo</span></div>
    <div class="stat"><b>${Math.round((r.penalidade_ms||0)/1000)}s</b><span>penalidade</span></div>
    <div class="stat"><b>${r.posicao??'—'}º</b><span>no ranking</span></div>
  </div>
  <p class="lead">${S.jogador.e_aluno
    ? 'Mostre esse resultado na recepção. Tem gente da sua turma tentando bater esse tempo.'
    : 'A gente te chama no WhatsApp com o resultado e um convite para conhecer a escola. A aula experimental é gratuita.'}</p>
  <button class="btn" id="rank">Ver o ranking</button>
  <button class="btn ghost" style="margin-top:12px" id="denovo">Jogar de novo</button>
  <p class="hint" style="text-align:center">A cada rodada o cenário e os enigmas mudam.</p>
  ${rodape()}`;
  document.getElementById('rank').onclick=()=>telaRanking();
  document.getElementById('denovo').onclick=novaRodada;
}
async function novaRodada(){
  app.innerHTML='<div class="load">Remontando a escola…</div>';
  try{
    const r=await rpc('escape_iniciar',{p_nome:S.jogador.nome,p_apelido:S.jogador.apelido,
      p_whatsapp:S.jogador.whatsapp,p_e_aluno:!!S.jogador.e_aluno,p_origem_qr:QR,p_unidade:UNID.slug});
    S.sessao=r.sessao_id; S.feitas={}; S.fim=null; telaMapa();
  }catch(e){ location.reload(); }
}

/* ============ RANKING ============ */
async function telaRanking(aba){
  app.classList.remove('na-sala');
  aba=aba||'geral';
  app.innerHTML=`${marca()}
  <div class="topo"><h2>Ranking</h2>
    <button class="btn ghost small" id="volta">Voltar</button></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-a="geral">Geral</button>
    <button class="tab" data-a="alunos">Só alunos</button>
    ${S.salas.map(s=>`<button class="tab" data-a="sala:${s.slug}">${esc(s.nome)}</button>`).join('')}
  </div>
  <div class="rank" id="lista"><div class="load">Carregando…</div></div>
  <p class="hint" style="text-align:center;margin-top:16px">Só o top 10 aparece aqui. Sua posição fica na sua tela de resultado.</p>
  ${rodape()}`;
  document.getElementById('volta').onclick=()=>S.fim?telaFim():telaMapa();
  document.querySelectorAll('#tabs .tab').forEach(b=>{
    b.setAttribute('aria-selected',b.dataset.a===aba);
    b.onclick=()=>telaRanking(b.dataset.a);
  });
  const lista=document.getElementById('lista');
  try{
    if(aba.indexOf('sala:')===0){
      const sala=S.salas.find(x=>x.slug===aba.slice(5));
      const d=sala?await sel(`escape_ranking_sala?sala_id=eq.${sala.id}&order=posicao.asc&limit=10&select=posicao,apelido,e_aluno,pontuacao,tempo_ms`):[];
      lista.innerHTML=d.length?d.map(x=>linha(x,x.tempo_ms)).join(''):vazio();
    }else{
      const f=aba==='alunos'?'&e_aluno=eq.true':'';
      const tp=UNID.temporadas.length?`&temporada_id=in.(${UNID.temporadas.join(',')})`:'&temporada_id=is.null';
      const d=await sel(`escape_ranking_geral?order=posicao.asc&limit=10${f}${tp}&select=posicao,apelido,e_aluno,pontuacao,tempo_total_ms`);
      lista.innerHTML=d.length?d.map((x,i)=>linha(Object.assign({},x,{posicao:aba==='alunos'?i+1:x.posicao}),x.tempo_total_ms)).join(''):vazio();
    }
  }catch(e){ lista.innerHTML='<div class="alerta">Não deu para carregar o ranking agora.</div>'; }
}
const vazio=()=>`<div class="instr">Ninguém no pódio ainda. Seja o primeiro a achar a Dani.</div>`;
function linha(d,t){
  const eu=S.jogador&&d.apelido===S.jogador.apelido;
  return `<div class="row" data-me="${eu}">
    <span class="pos">${d.posicao}</span>
    <span><span class="ap">${esc(d.apelido)}</span><br><span class="tag">${d.e_aluno?'aluno':'visitante'} · ${ms2(t)}</span></span>
    <span class="pt">${d.pontuacao}</span></div>`;
}

/* ============ BOOT ============ */
(async()=>{
  try{ await resolveUnidade(); await carregaSalas(); telaIntro(); }
  catch(e){ app.innerHTML=`${marca()}<div class="alerta">Não deu para abrir o jogo agora. Recarregue a página.</div>`; }
})();
</script>
</body>
</html>
